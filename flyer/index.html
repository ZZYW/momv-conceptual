<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mountain of Many Voices — poster</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --serif: "Helvetica Neue", Helvetica, sans-serif;
        --sans: "Helvetica Neue", Helvetica, sans-serif;
        --mono:
          "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 20px;
        background: #e8e8e8;
        color: #111;
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      /* Letter frame: 8.5" × 11" at 96dpi = 816 × 1056px */
      .letter-frame {
        width: 816px;
        height: 1056px;
        border: 1px solid #111;
        margin: 0 auto;
        overflow: hidden;
        position: relative;
        background: #fff;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
      }

      .page {
        width: 1100px;
        padding: 34px 50px 60px;
        transform: scale(0.7418);
        transform-origin: top left;
      }

      @media print {
        @page { size: letter; margin: 0; }
        html, body { margin: 0; padding: 0; background: #fff; }
        .letter-frame {
          border: none;
          box-shadow: none;
          margin: 0;
          width: 8.5in;
          height: 11in;
        }
        .return-to-game { display: none !important; }
      }

      .return-to-game {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 9998;
        font-family: var(--mono);
        font-size: 12px;
        color: #111;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid #111;
        padding: 6px 10px;
        text-decoration: none;
        cursor: pointer;
      }
      .return-to-game:hover {
        background: #111;
        color: #fff;
      }

      /* ── MASTHEAD ── */
      .masthead {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding-bottom: 9px;
        border-bottom: 1px solid #111;
      }
      .title-block {
        display: flex;
        align-items: baseline;
        gap: 0;
      }
      .logo {
        font-family: var(--serif);
        font-size: 23px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: -1px;
        margin-right: 16px;
      }
      .logo em {
        font-style: italic;
      }
      .divider {
        display: inline-block;
        width: 1px;
        height: 36px;
        background: #111;
        margin: 0 16px 6px;
      }
      .subtitle {
        font-family: var(--sans);
        font-size: 12.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding-bottom: 7px;
      }
      .byline {
        font-family: var(--serif);
        font-size: 13.5px;
        padding-bottom: 8px;
      }

      /* ── TWO-COL INTRO ── */
      .intro {
        columns: 2;
        column-gap: 44px;
        margin-top: 14px;
        font-weight: 500;
        font-size: 15px;
        line-height: 1.42;
      }
      .intro p {
        margin: 0 0 7px;
        break-inside: avoid;
      }
      .intro p::before {
        content: "¶ ";
      }
      .intro em {
        font-style: italic;
      }

      /* ── SECTION HEAD ── */
      .section-h {
        font-family: var(--sans);
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.11em;
        text-transform: uppercase;
        margin: 26px 0 0;
      }

      /* ── DIAGRAM ── */
      .diagram {
        position: relative;
        margin-top: 6px;
        /* tall enough for callouts not to clip */
        height: 710px;
      }

      /* Ring SVG — centered */
      .ring {
        position: absolute;
        left: 50%;
        top: 100px;
        transform: translateX(-50%);
        width: 420px;
        height: 420px;
      }
      .ring svg {
        width: 100%;
        height: 100%;
      }

      /* Connector lines SVG — full diagram area overlay */
      .connectors {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .connectors line,
      .connectors path {
        stroke: #b0b0b0;
        stroke-width: 0.9;
        fill: none;
      }

      /* Callout blocks */
      .c {
        position: absolute;
      }
      .c .lede {
        font-family: var(--serif);
        font-size: 12.5px;
        font-weight: 700;
        line-height: 1.38;
        margin: 0;
      }
      .c .lede .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 17px;
        height: 17px;
        border: 1px solid #111;
        border-radius: 50%;
        font-family: var(--sans);
        font-size: 9.5px;
        font-weight: 500;
        line-height: 1;
        margin-right: 4px;
        flex-shrink: 0;
        vertical-align: middle;
        position: relative;
        top: -1px;
      }
      .c .note {
        display: block;
        margin-top: 5px;
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.45;
        color: #444;
      }

      /* Individual positions — ring center ≈ (550, 355) within .diagram */
      /* Ring radius ≈ 141px on screen (390/360 * 130 = 140.8) */
      /* Nodes (diagram-relative, ring stage left=355, top=160):
     scale = 390/360 = 1.0833
     1 top    SVG(180, 50)  → page(550, 214)
     2 NE     SVG(272, 88)  → page(650, 255)
     3 E      SVG(310, 180) → page(691, 355)
     4 SE     SVG(272, 272) → page(650, 454)
     5 S      SVG(180, 310) → page(550, 496)
     6 SW     SVG(88, 272)  → page(450, 454)
     7 W      SVG(50, 180)  → page(409, 355)
     8 NW     SVG(88, 88)   → page(450, 255)
  */

      /* ring: 420px, top:100, center=(500,310), radius≈152px
     node1=(500,158) node2=(607,203) node3=(652,310) node4=(607,417)
     node5=(500,462) node6=(393,417) node7=(348,310) node8=(393,203) */
      .c1 { top:-36px;  left:562px; width:392px; }
      .c2 { top:142px;  left:663px; width:331px; }
      .c3 { top:234px;  left:723px; width:262px; }
      .c4 { top:368px;  left:691px; width:286px; }
      .c5 { top:541px;  left:456px; width:355px; }
      .c6 { top:495px;  left:43px;  width:361px; }
      .c7 { top:195px;  left:9px;   width:302px; }
      .c8 { top:8px;    left:41px;  width:426px; }

    </style>
  </head>
  <body>
    <a class="return-to-game" href="/" onclick="if(window.history.length>1){history.back();return false;}">← return to game</a>
    <div class="letter-frame">

<script>
/* ── content loader ── reads content.md and populates the page ── */
(async function () {
  const res = await fetch('./content.md');
  if (!res.ok) { console.error('content.md not found'); return; }
  const text = await res.text();

  /* parse [SECTION NAME] blocks */
  const sections = {};
  let key = null, buf = [];
  for (const line of text.split('\n')) {
    const m = line.match(/^\[(.+)\]$/);
    if (m) {
      if (key !== null) sections[key] = buf.join('\n').trim();
      key = m[1]; buf = [];
    } else if (key !== null) {
      buf.push(line);
    }
  }
  if (key !== null) sections[key] = buf.join('\n').trim();

  /* inline markdown: *text* → <em>  "smart quotes" stay as-is */
  const md = t => t.replace(/\*(.*?)\*/g, '<em>$1</em>');

  /* masthead */
  document.querySelector('.logo').textContent     = sections['TITLE']    || '';
  document.querySelector('.subtitle').textContent = sections['SUBTITLE'] || '';
  document.querySelector('.byline').textContent   = sections['BYLINE']   || '';
  document.querySelector('.section-h').textContent = sections['SECTION-HEADER'] || '';

  /* footer */
  const footer = document.getElementById('footer-url');
  if (footer) footer.innerHTML = (sections['FOOTER'] || '').replace('\n', '<br>');

  /* intro paragraphs */
  const intro = document.querySelector('.intro');
  intro.innerHTML = '';
  for (const p of (sections['INTRO'] || '').split('\n\n')) {
    if (!p.trim()) continue;
    const el = document.createElement('p');
    el.innerHTML = md(p.trim());
    intro.appendChild(el);
  }

  /* callouts 1-8 */
  for (let i = 1; i <= 8; i++) {
    const block = sections['CALLOUT ' + i];
    if (!block) continue;
    const parts = block.split('\n\n');
    const lede = (parts[0] || '').trim();
    const note = parts.slice(1).join('\n\n').trim();
    const ledeEl = document.querySelector('.c' + i + ' .lede-text');
    const noteEl = document.querySelector('.c' + i + ' .note');
    if (ledeEl) ledeEl.textContent = lede;
    if (noteEl) noteEl.textContent = note;
  }
})();
</script>

<script>
/* ── Drag / Resize widget — toggle with Shift+D+A ── */
(function () {
  const SCALE = 0.7418;
  let active = false;
  let panel, keys = {};

  document.addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if (keys['shift'] && keys['d'] && keys['a']) toggle();
  });
  document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  function toggle() {
    active = !active;
    if (active) enable(); else disable();
  }

  function enable() {
    panel = document.createElement('div');
    panel.id = '_pos-panel';
    Object.assign(panel.style, {
      position:'fixed', bottom:'12px', right:'12px', zIndex:9999,
      background:'rgba(0,0,0,0.82)', color:'#0f0', fontFamily:'monospace',
      fontSize:'11px', padding:'10px 12px', borderRadius:'6px',
      whiteSpace:'pre', lineHeight:'1.6', maxHeight:'60vh', overflowY:'auto',
      pointerEvents:'none',
    });
    document.body.appendChild(panel);

    document.querySelectorAll('.diagram > .c').forEach(el => {
      el.dataset._origOutline = el.style.outline || '';
      el.style.outline = '1.5px dashed rgba(255,80,0,0.7)';
      el.style.cursor = 'move';

      const handle = document.createElement('div');
      handle.className = '_resize-handle';
      Object.assign(handle.style, {
        position:'absolute', bottom:0, right:0, width:'10px', height:'10px',
        background:'rgba(255,80,0,0.8)', cursor:'se-resize',
      });
      el.appendChild(handle);
      el.addEventListener('mousedown', onMouseDown);
    });

    updatePanel();
    document.body.style.userSelect = 'none';
    showToast('Drag mode ON (Shift+D+A to exit)');
  }

  function disable() {
    if (panel) { panel.remove(); panel = null; }
    document.querySelectorAll('.diagram > .c').forEach(el => {
      el.style.outline = el.dataset._origOutline || '';
      el.style.cursor = '';
      const h = el.querySelector('._resize-handle');
      if (h) h.remove();
      el.removeEventListener('mousedown', onMouseDown);
    });
    document.body.style.userSelect = '';
    showToast('Drag mode OFF');
  }

  function onMouseDown(e) {
    const el = this;
    const handle = e.target.classList.contains('_resize-handle');
    const startX = e.clientX, startY = e.clientY;
    const startLeft = parseInt(el.style.left) || el.offsetLeft;
    const startTop  = parseInt(el.style.top)  || el.offsetTop;
    const startW    = el.offsetWidth;

    function onMove(ev) {
      const dx = (ev.clientX - startX) / SCALE;
      const dy = (ev.clientY - startY) / SCALE;
      if (handle) {
        el.style.width = Math.round(startW + dx) + 'px';
      } else {
        el.style.left = Math.round(startLeft + dx) + 'px';
        el.style.top  = Math.round(startTop  + dy) + 'px';
      }
      updatePanel();
    }
    function onUp() {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    e.preventDefault();
    e.stopPropagation();
  }

  function updatePanel() {
    if (!panel) return;
    const lines = ['POSITIONS (copy ↓)', ''];
    document.querySelectorAll('.diagram > .c').forEach(el => {
      const cls = Array.from(el.classList).find(c => /^c\d+$/.test(c));
      const t = parseInt(el.style.top)  ?? el.offsetTop;
      const l = parseInt(el.style.left) ?? el.offsetLeft;
      const w = el.offsetWidth;
      lines.push(`.${cls}{top:${t}px;left:${l}px;width:${w}px}`);
    });
    panel.textContent = lines.join('\n');
    const css = lines.slice(2).join('\n');
    navigator.clipboard?.writeText(css).catch(() => {});
  }

  function showToast(msg) {
    const t = document.createElement('div');
    Object.assign(t.style, {
      position:'fixed', top:'14px', left:'50%', transform:'translateX(-50%)',
      background:'rgba(0,0,0,0.75)', color:'#fff', fontFamily:'monospace',
      fontSize:'12px', padding:'6px 14px', borderRadius:'4px', zIndex:10000,
      pointerEvents:'none',
    });
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2000);
  }
})();
</script>
